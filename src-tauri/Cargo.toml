[package]
name = "adm"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-hwinfo = "0.2.3"
tauri-plugin-single-instance = "2"
windows = { version = "0.58", features = ["Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
# admAgent server 本地传输（Unix socket / Windows named pipe）：reqwest 不支持，
# 用 hyper 直接对 socket/pipe 发 HTTP/1.1 请求与 SSE 流
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
libc = "0.2"
# hyper-util legacy client 的 Connect 基于 tower-service（hyper 1.9 不再 re-export）
tower-service = "0.3"
dirs = "6"
futures-util = "0.3"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
wechatbot = "0.4"
